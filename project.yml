name: WorkoutApp
options:
  bundleIdPrefix: com.gabrielmota
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

targets:
  WorkoutApp:
    type: application
    platform: iOS
    sources:
      - path: Sources/WorkoutApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gabrielmota.workoutapp
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  WorkoutApp:
    build:
      targets:
        WorkoutApp: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
